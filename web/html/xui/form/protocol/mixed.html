{{define "form/mixed"}}
<a-form layout="inline">
    <a-form-item label="认证">
        <a-select v-model="inbound.settings.auth" style="width: 120px">
            <a-select-option value="noauth">noauth</a-select-option>
            <a-select-option value="password">password</a-select-option>
        </a-select>
    </a-form-item>
    <a-form-item label="UDP"><a-switch v-model="inbound.settings.udp"></a-switch></a-form-item>
    <a-form-item v-if="inbound.settings.udp" label="UDP IP">
        <a-input v-model.trim="inbound.settings.ip"></a-input>
    </a-form-item>
</a-form>
<template v-if="inbound.settings.auth === 'password'">
    <a-form layout="inline" v-for="(account, index) in inbound.settings.accounts" :key="index">
        <a-form-item :label="'用户名 ' + (index + 1)"><a-input v-model.trim="account.user"></a-input></a-form-item>
        <a-form-item label="密码"><a-input v-model.trim="account.pass"></a-input></a-form-item>
        <a-form-item><a-button type="danger" size="small" @click="inbound.settings.delAccount(index)">删除</a-button></a-form-item>
    </a-form>
    <a-button size="small" @click="inbound.settings.addAccount()">添加账户</a-button>
</template>
{{end}}
