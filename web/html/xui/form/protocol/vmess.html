{{define "form/vmess"}}
<a-form layout="inline">
    <a-form-item label="id">
        <a-input v-model.trim="inbound.settings.vmesses[0].id">
            <template slot="addonAfter"><a-button icon="reload" title="重新生成 UUID" @click="inbound.settings.vmesses[0].id = RandomUtil.randomUUID()"></a-button></template>
        </a-input>
    </a-form-item>
    <a-form-item label="额外 ID">
        <a-input type="number" v-model.number="inbound.settings.vmesses[0].alterId"></a-input>
    </a-form-item>
    <a-form-item label="security">
        <a-select v-model="inbound.settings.vmesses[0].security" style="width: 150px">
            <a-select-option value="auto">auto</a-select-option>
            <a-select-option value="aes-128-gcm">aes-128-gcm</a-select-option>
            <a-select-option value="chacha20-poly1305">chacha20-poly1305</a-select-option>
            <a-select-option value="none">none</a-select-option>
            <a-select-option value="zero">zero</a-select-option>
        </a-select>
    </a-form-item>
    <a-form-item label="email">
        <a-input v-model.trim="inbound.settings.vmesses[0].email">
            <template slot="addonAfter"><a-button icon="reload" title="重新生成 email" @click="regenerateEmail(inbound.settings.vmesses[0])"></a-button></template>
        </a-input>
    </a-form-item>
    <a-form-item label="禁用不安全加密">
        <a-switch v-model.number="inbound.settings.disableInsecure"></a-switch>
    </a-form-item>
</a-form>
{{end}}
