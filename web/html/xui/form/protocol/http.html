{{define "form/http"}}
<a-form layout="inline" v-for="(account, index) in inbound.settings.accounts" :key="index">
    <a-form-item :label="'用户名 ' + (index + 1)">
        <a-input v-model.trim="account.user"></a-input>
    </a-form-item>
    <a-form-item label="密码">
        <a-input v-model.trim="account.pass"></a-input>
    </a-form-item>
    <a-form-item><a-button type="danger" size="small" @click="inbound.settings.delAccount(index)">删除</a-button></a-form-item>
</a-form>
<a-form layout="inline">
    <a-form-item><a-button size="small" @click="inbound.settings.addAccount()">添加账户</a-button></a-form-item>
    <a-form-item label="allowTransparent">
        <a-switch v-model="inbound.settings.allowTransparent"></a-switch>
    </a-form-item>
</a-form>
{{end}}
