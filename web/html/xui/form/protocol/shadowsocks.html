{{define "form/shadowsocks"}}
<a-form layout="inline">
    <a-form-item label="加密">
        <a-select v-model="inbound.settings.method" style="width: 250px;" @change="inbound.settings.regeneratePassword()">
            <a-select-option v-for="method in SSMethods" :value="method">[[ method ]]</a-select-option>
        </a-select>
    </a-form-item>
    <a-form-item label="密码">
        <a-input v-model.trim="inbound.settings.password"></a-input>
        <a-button size="small" @click="inbound.settings.regeneratePassword()">生成</a-button>
    </a-form-item>
    <a-form-item label="网络">
        <a-select v-model="inbound.settings.network" style="width: 100px;">
            <a-select-option value="tcp,udp">tcp+udp</a-select-option>
            <a-select-option value="tcp">tcp</a-select-option>
            <a-select-option value="udp">udp</a-select-option>
        </a-select>
    </a-form-item>
    <a-form-item label="ivCheck">
        <a-switch v-model="inbound.settings.ivCheck"></a-switch>
    </a-form-item>
</a-form>

<template v-if="inbound.settings.is2022">
    <a-form layout="inline">
        <a-form-item label="2022 多用户">
            <a-button type="primary" size="small" @click="inbound.settings.addClient()">+</a-button>
        </a-form-item>
    </a-form>
    <a-form v-for="(client, index) in inbound.settings.clients" :key="index" layout="inline">
        <a-divider>client [[ index + 1 ]]</a-divider>
        <a-form-item label="email">
            <a-input v-model.trim="client.email">
                <template slot="addonAfter"><a-button icon="reload" title="重新生成 email" @click="regenerateEmail(client)"></a-button></template>
            </a-input>
        </a-form-item>
        <a-form-item label="password">
            <a-input v-model.trim="client.password">
                <template slot="addonAfter"><a-button icon="reload" title="重新生成密码" @click="client.password = RandomUtil.randomShadowsocksPassword(inbound.settings.method)"></a-button></template>
            </a-input>
        </a-form-item>
        <a-form-item label="method"><a-input v-model.trim="client.method"></a-input></a-form-item>
        <a-button type="danger" size="small" @click="inbound.settings.delClient(index)">-</a-button>
    </a-form>
</template>
{{end}}
