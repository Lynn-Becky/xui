{{define "form/inbound"}}
<a-tabs class="inbound-form-tabs" v-model="inModal.activeTab" :animated="false" @change="inboundTabChange">
    <a-tab-pane key="basic" tab="基础配置" force-render>
        <a-form layout="inline">
            <a-form-item label='{{ i18n "remark" }}'>
                <a-input v-model.trim="dbInbound.remark"></a-input>
            </a-form-item>
            <a-form-item label='{{ i18n "enable" }}'>
                <a-switch v-model="dbInbound.enable"></a-switch>
            </a-form-item>
            <a-form-item label='{{ i18n "protocol" }}'>
                <a-select v-model="inbound.protocol" style="width: 160px;">
                    <a-select-option v-for="p in Protocols" :key="p" :value="p">[[ p ]]</a-select-option>
                </a-select>
            </a-form-item>
            <a-form-item>
                <span slot="label">
                    监听 IP
                    <a-tooltip>
                        <template slot="title">默认留空即可</template>
                        <a-icon type="question-circle" theme="filled"></a-icon>
                    </a-tooltip>
                </span>
                <a-input v-model.trim="inbound.listen"></a-input>
            </a-form-item>
            <a-form-item label="端口">
                <a-input type="number" v-model.number="inbound.port">
                    <template slot="addonAfter">
                        <a-button icon="reload" title="重新生成端口" @click="regeneratePort"></a-button>
                    </template>
                </a-input>
            </a-form-item>
            <a-form-item>
                <span slot="label">
                    总流量(GB)
                    <a-tooltip>
                        <template slot="title">0 表示不限制</template>
                        <a-icon type="question-circle" theme="filled"></a-icon>
                    </a-tooltip>
                </span>
                <a-input-number v-model="dbInbound.totalGB" :min="0"></a-input-number>
            </a-form-item>
            <a-form-item>
                <span slot="label">
                    到期时间
                    <a-tooltip>
                        <template slot="title">留空则永不到期</template>
                        <a-icon type="question-circle" theme="filled"></a-icon>
                    </a-tooltip>
                </span>
                <a-date-picker :show-time="{ format: 'HH:mm' }" format="YYYY-MM-DD HH:mm"
                               v-model="dbInbound._expiryTime" style="width: 300px;"></a-date-picker>
            </a-form-item>
        </a-form>
    </a-tab-pane>

    <a-tab-pane key="protocol" tab="协议" force-render>
        <template v-if="inbound.protocol === Protocols.VMESS">
            {{template "form/vmess"}}
        </template>
        <template v-if="inbound.protocol === Protocols.VLESS">
            {{template "form/vless"}}
        </template>
        <template v-if="inbound.protocol === Protocols.TROJAN">
            {{template "form/trojan"}}
        </template>
        <template v-if="inbound.protocol === Protocols.SHADOWSOCKS">
            {{template "form/shadowsocks"}}
        </template>
        <template v-if="inbound.protocol === Protocols.MIXED">
            {{template "form/mixed"}}
        </template>
        <template v-if="inbound.protocol === Protocols.TUNNEL">
            {{template "form/tunnel"}}
        </template>
        <template v-if="inbound.protocol === Protocols.HTTP">
            {{template "form/http"}}
        </template>
        <template v-if="inbound.protocol === Protocols.WIREGUARD">
            {{template "form/wireguard"}}
        </template>
        <template v-if="inbound.protocol === Protocols.HYSTERIA">
            {{template "form/hysteria"}}
        </template>
    </a-tab-pane>

    <a-tab-pane key="transport" tab="传输" force-render :disabled="!inbound.canEnableStream()">
        <template v-if="inbound.canEnableStream()">
            <template v-if="inbound.protocol === Protocols.HYSTERIA">
                {{template "form/hysteriaStream"}}
            </template>
            <template v-else>
                {{template "form/streamSettings"}}
            </template>
        </template>
    </a-tab-pane>

    <a-tab-pane key="security" tab="安全" force-render
                :disabled="!inbound.canEnableStream() || (!inbound.canEnableTls() && !inbound.canEnableReality())">
        <template v-if="inbound.canEnableStream() && (inbound.canEnableTls() || inbound.canEnableReality())">
            {{template "form/tlsSettings"}}
        </template>
    </a-tab-pane>

    <a-tab-pane key="sniffing" tab="嗅探" force-render :disabled="!inbound.canSniffing()">
        <template v-if="inbound.canSniffing()">
            {{template "form/sniffing"}}
        </template>
    </a-tab-pane>

    <a-tab-pane key="advanced" tab="高级配置" force-render>
        <pre class="inbound-json-preview">[[ inModal.inboundJsonPreview ]]</pre>
    </a-tab-pane>
</a-tabs>
{{end}}
