{{define "form/realitySettings"}}
<a-divider>REALITY</a-divider>
<a-form layout="inline">
    <a-form-item label="show"><a-switch v-model="inbound.stream.reality.show"></a-switch></a-form-item>
    <a-form-item label="xver"><a-input-number v-model="inbound.stream.reality.xver" :min="0"></a-input-number></a-form-item>
    <a-form-item label="target">
        <a-input v-model.trim="inbound.stream.reality.target" placeholder="example.com:443"></a-input>
    </a-form-item>
    <a-form-item label="SNI">
        <a-select mode="tags" v-model="inbound.stream.reality.serverNames" style="min-width: 260px"></a-select>
    </a-form-item>
    <a-form-item label="privateKey">
        <a-input v-model.trim="inbound.stream.reality.privateKey"></a-input>
        <a-button size="small" type="primary" @click="generateRealityKeyPair">生成 X25519</a-button>
    </a-form-item>
    <a-form-item label="shortIds">
        <a-select mode="tags" v-model="inbound.stream.reality.shortIds" style="min-width: 260px"></a-select>
        <a-button size="small" icon="reload" title="重新生成 shortIds" @click="regenerateRealityShortIds"></a-button>
    </a-form-item>
    <a-form-item label="minClientVer"><a-input v-model.trim="inbound.stream.reality.minClientVer"></a-input></a-form-item>
    <a-form-item label="maxClientVer"><a-input v-model.trim="inbound.stream.reality.maxClientVer"></a-input></a-form-item>
    <a-form-item label="maxTimediff"><a-input-number v-model="inbound.stream.reality.maxTimediff" :min="0"></a-input-number></a-form-item>
    <a-form-item label="mldsa65Seed">
        <a-input type="textarea" :rows="2" v-model="inbound.stream.reality.mldsa65Seed"></a-input>
        <a-button size="small" type="primary" @click="generateMldsa65">生成 ML-DSA-65</a-button>
    </a-form-item>
    <a-form-item label="masterKeyLog"><a-input v-model.trim="inbound.stream.reality.masterKeyLog"></a-input></a-form-item>
    <a-form-item label="publicKey"><a-input v-model.trim="inbound.stream.reality.settings.publicKey"></a-input></a-form-item>
    <a-form-item label="fingerprint">
        <a-select v-model="inbound.stream.reality.settings.fingerprint" style="width: 150px">
            <a-select-option v-for="fp in ['chrome','firefox','safari','ios','android','edge','360','qq','random','randomized','randomizednoalpn','unsafe']" :key="fp" :value="fp">[[ fp ]]</a-select-option>
        </a-select>
    </a-form-item>
    <a-form-item label="spiderX">
        <a-input v-model.trim="inbound.stream.reality.settings.spiderX"></a-input>
    </a-form-item>
    <a-form-item label="mldsa65Verify"><a-input type="textarea" :rows="2" v-model="inbound.stream.reality.settings.mldsa65Verify"></a-input></a-form-item>
</a-form>
{{end}}
