{{define "inboundModal"}}
<a-modal id="inbound-modal" class="inbound-modal" v-model="inModal.visible" :title="inModal.title" @ok="inModal.ok"
         :confirm-loading="inModal.confirmLoading" :closable="true" :mask-closable="false"
         :width="780" :ok-text="inModal.okText" cancel-text='{{ i18n "close" }}'>
    {{template "form/inbound"}}
</a-modal>
<script>

    const inModal = {
        title: '',
        visible: false,
        confirmLoading: false,
        okText: '确定',
        activeTab: 'basic',
        inboundJsonPreview: '',
        confirm: null,
        inbound: new Inbound(),
        dbInbound: new DBInbound(),
        ok() {
            ObjectUtil.execute(inModal.confirm, inModal.inbound, inModal.dbInbound);
        },
        show({ title='', okText='确定', inbound=null, dbInbound=null, confirm=(inbound, dbInbound)=>{} }) {
            this.title = title;
            this.okText = okText;
            if (inbound) {
                this.inbound = Inbound.fromJson(inbound.toJson());
            } else {
                this.inbound = new Inbound();
            }
            if (dbInbound) {
                this.dbInbound = new DBInbound(dbInbound);
            } else {
                this.dbInbound = new DBInbound();
            }
            this.confirm = confirm;
            this.activeTab = 'basic';
            this.inboundJsonPreview = '';
            this.visible = true;
        },
        close() {
            inModal.visible = false;
            inModal.loading(false);
        },
        loading(loading) {
            inModal.confirmLoading = loading;
        },
    };

    const protocols = {
        VMESS: Protocols.VMESS,
        VLESS: Protocols.VLESS,
        TROJAN: Protocols.TROJAN,
        SHADOWSOCKS: Protocols.SHADOWSOCKS,
        HTTP: Protocols.HTTP,
        MIXED: Protocols.MIXED,
        TUNNEL: Protocols.TUNNEL,
        WIREGUARD: Protocols.WIREGUARD,
        HYSTERIA: Protocols.HYSTERIA,
    };

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#inbound-modal',
        data: {
            inModal: inModal,
            Protocols: protocols,
            SSMethods: SSMethods,
            get inbound() {
                return inModal.inbound;
            },
            get dbInbound() {
                return inModal.dbInbound;
            },
            vlessEncryptionAuth: 'x25519',
            vlessEncryptionAuths: [
                {id: 'x25519', label: 'X25519 (native)'},
                {id: 'x25519_xorpub', label: 'X25519 (xorpub)'},
                {id: 'x25519_random', label: 'X25519 (random)'},
                {id: 'mlkem768', label: 'ML-KEM-768 (native)'},
                {id: 'mlkem768_xorpub', label: 'ML-KEM-768 (xorpub)'},
                {id: 'mlkem768_random', label: 'ML-KEM-768 (random)'},
            ],
        },
        methods: {
            inboundTabChange(tab) {
                if (tab === 'advanced') {
                    this.inModal.inboundJsonPreview = this.inbound.toString();
                }
            },
            async generateVlessEncryption() {
                const msg = await HttpUtil.post('/server/getNewVlessEnc');
                if (!msg.success || !msg.obj || !Array.isArray(msg.obj.auths)) return;
                const auth = msg.obj.auths.find(item => item.id === this.vlessEncryptionAuth) || msg.obj.auths[0];
                if (auth) {
                    this.inbound.settings.decryption = auth.decryption;
                    this.inbound.settings.encryption = auth.encryption;
                }
            },
            clearVlessEncryption() {
                this.inbound.settings.decryption = 'none';
                this.inbound.settings.encryption = 'none';
            },
            regeneratePort() {
                this.inbound.port = RandomUtil.randomIntRange(10000, 60000);
            },
            regenerateEmail(target) {
                target.email = RandomUtil.randomLowerAndNum(12);
            },
            regenerateRealityShortIds() {
                this.inbound.stream.reality.shortIds = RandomUtil.randomShortIds();
            },
            async streamSecurityChange(security) {
                if (security !== 'reality') return;
                const reality = this.inbound.stream.reality;
                if (!Array.isArray(reality.shortIds) || reality.shortIds.length === 0) {
                    this.regenerateRealityShortIds();
                }
                if (!reality.privateKey || !reality.settings.publicKey) {
                    await this.generateRealityKeyPair();
                }
            },
            async generateRealityKeyPair() {
                const msg = await HttpUtil.post('/server/getNewX25519Cert');
                if (msg.success) {
                    this.inbound.stream.reality.privateKey = msg.obj.privateKey;
                    this.inbound.stream.reality.settings.publicKey = msg.obj.publicKey;
                }
            },
            async generateMldsa65() {
                const msg = await HttpUtil.post('/server/getNewMldsa65');
                if (msg.success) {
                    this.inbound.stream.reality.mldsa65Seed = msg.obj.seed;
                    this.inbound.stream.reality.settings.mldsa65Verify = msg.obj.verify;
                }
            },
            regenerateWireguardServerKey() {
                this.inbound.settings.secretKey = Wireguard.generateKeypair().privateKey;
            },
            wireguardClientPrivateKeyChanged(client) {
                if (!client.privateKey) {
                    client.publicKey = '';
                    return;
                }
                try {
                    client.publicKey = Wireguard.generateKeypair(client.privateKey).publicKey;
                } catch (_) {
                    client.publicKey = '';
                }
            },
            regenerateWireguardClientKey(client) {
                const keypair = Wireguard.generateKeypair();
                client.privateKey = keypair.privateKey;
                client.publicKey = keypair.publicKey;
            },
            streamNetworkChange(oldValue) {
                if (this.inbound.stream.isReality && !this.inbound.canEnableReality()) {
                    this.inbound.stream.security = 'none';
                } else if (this.inbound.stream.isTls && !this.inbound.canEnableTls()) {
                    this.inbound.stream.security = 'none';
                }
            }
        }
    });

</script>
{{end}}
