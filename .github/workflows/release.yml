name: Release X-ui
on:
  push:
    tags:
      - 0.*
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: 1.26.5
  XRAY_VERSION: v26.6.27
  # Pinned, like XRAY_VERSION. Tracking "latest" meant every release silently
  # baked in whatever a third-party maintainer had published most recently, with
  # nothing recorded to audit against — and these files decide which traffic is
  # proxied and which goes direct, so a bad one deanonymises users rather than
  # merely breaking a build.
  GEO_RULES_VERSION: "202607252248"

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not leave the workflow token in .git/config: every job here is
          # granted contents:write, and any action in the job can otherwise read
          # a credential that can overwrite published release assets. The steps
          # that need it pass GH_TOKEN explicitly.
          persist-credentials: false
      - name: Select release tag
        id: release_tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = (Get-Content -LiteralPath 'config/version' -Raw -Encoding UTF8).Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'config/version must contain a release tag.' }
          git check-ref-format --allow-onelevel "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Invalid release tag in config/version: $tag" }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Pushed tag '$env:GITHUB_REF_NAME' does not match config/version '$tag'."
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease --target "$GITHUB_SHA" --title "$RELEASE_TAG"
  linuxamd64build:
    name: build x-ui amd64 version
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not leave the workflow token in .git/config: every job here is
          # granted contents:write, and any action in the job can otherwise read
          # a credential that can overwrite published release assets. The steps
          # that need it pass GH_TOKEN explicitly.
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build linux amd64 version
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -pgo=default.pgo -o xui-release -v .
          mkdir x-ui
          cp xui-release x-ui/xui-release
          cp x-ui.service x-ui/x-ui.service
          cp x-ui.sh x-ui/x-ui.sh
          # Ship the OpenRC script too. It was never packaged, so every Alpine
          # install fell through to downloading its root init script from the
          # mutable main branch.
          cp x-ui.rc x-ui/x-ui.rc
          cd x-ui
          mv xui-release x-ui
          mkdir bin
          cd bin
          xray_archive=Xray-linux-64.zip
          xray_base="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}"
          wget -q "${xray_base}/${xray_archive}"
          # Verify against the digest XTLS publishes for each asset; the binary
          # ends up in every release tarball and is executed as root.
          wget -q "${xray_base}/${xray_archive}.dgst"
          expected="$(grep -iE '^(SHA2-256|SHA256)=' "${xray_archive}.dgst" | head -n1 | cut -d= -f2 | tr -d '[:space:]')"
          test -n "${expected}" || { echo "no SHA-256 digest published for ${xray_archive}" >&2; exit 1; }
          echo "${expected}  ${xray_archive}" | sha256sum -c -
          unzip "${xray_archive}"
          rm -f "${xray_archive}" "${xray_archive}.dgst" geoip.dat geosite.dat
          for geo_file in geoip.dat geosite.dat; do
            geo_base="https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/${GEO_RULES_VERSION}"
            wget -q "${geo_base}/${geo_file}"
            wget -q "${geo_base}/${geo_file}.sha256sum"
            sha256sum -c "${geo_file}.sha256sum"
            rm -f "${geo_file}.sha256sum"
          done
          mv xray xray-linux-amd64
          cd ..
          cd ..
      - name: package
        # Record root ownership in the archive. GNU tar restores the archived
        # uid/gid when extracting as root, so packing as the CI runner (uid 1001)
        # made the installed, root-executed binary owned by uid 1001 on the
        # target host. The installer also passes --no-same-owner.
        run: tar --owner=0 --group=0 --numeric-owner -zcvf x-ui-linux-amd64.tar.gz x-ui
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" x-ui-linux-amd64.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
  linuxarm64build:
    name: build x-ui arm64 version
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not leave the workflow token in .git/config: every job here is
          # granted contents:write, and any action in the job can otherwise read
          # a credential that can overwrite published release assets. The steps
          # that need it pass GH_TOKEN explicitly.
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build linux arm64 version
        run: |
          sudo apt-get update
          sudo apt install gcc-aarch64-linux-gnu
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc go build -pgo=default.pgo -o xui-release -v .
          mkdir x-ui
          cp xui-release x-ui/xui-release
          cp x-ui.service x-ui/x-ui.service
          cp x-ui.sh x-ui/x-ui.sh
          # Ship the OpenRC script too. It was never packaged, so every Alpine
          # install fell through to downloading its root init script from the
          # mutable main branch.
          cp x-ui.rc x-ui/x-ui.rc
          cd x-ui
          mv xui-release x-ui
          mkdir bin
          cd bin
          xray_archive=Xray-linux-arm64-v8a.zip
          xray_base="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}"
          wget -q "${xray_base}/${xray_archive}"
          wget -q "${xray_base}/${xray_archive}.dgst"
          expected="$(grep -iE '^(SHA2-256|SHA256)=' "${xray_archive}.dgst" | head -n1 | cut -d= -f2 | tr -d '[:space:]')"
          test -n "${expected}" || { echo "no SHA-256 digest published for ${xray_archive}" >&2; exit 1; }
          echo "${expected}  ${xray_archive}" | sha256sum -c -
          unzip "${xray_archive}"
          rm -f "${xray_archive}" "${xray_archive}.dgst" geoip.dat geosite.dat
          for geo_file in geoip.dat geosite.dat; do
            geo_base="https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/${GEO_RULES_VERSION}"
            wget -q "${geo_base}/${geo_file}"
            wget -q "${geo_base}/${geo_file}.sha256sum"
            sha256sum -c "${geo_file}.sha256sum"
            rm -f "${geo_file}.sha256sum"
          done
          mv xray xray-linux-arm64
          cd ..
          cd ..
      - name: package
        run: tar --owner=0 --group=0 --numeric-owner -zcvf x-ui-linux-arm64.tar.gz x-ui
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" x-ui-linux-arm64.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
  linuxalpinebuild:
    name: build x-ui Alpine ${{ matrix.arch }} version
    needs: [release, linuxamd64build, linuxarm64build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not leave the workflow token in .git/config: every job here is
          # granted contents:write, and any action in the job can otherwise read
          # a credential that can overwrite published release assets. The steps
          # that need it pass GH_TOKEN explicitly.
          persist-credentials: false
      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build musl binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = (Get-Location).Path
          $platform = 'linux/${{ matrix.arch }}'
          $buildCommand = "apk add --no-cache build-base && CGO_ENABLED=1 CGO_CFLAGS='-D_LARGEFILE64_SOURCE -D_GNU_SOURCE' GOOS=linux GOARCH=${{ matrix.arch }} go build -pgo=default.pgo -trimpath -ldflags='-s -w -buildid=' -o /src/xui-alpine ."
          docker run --rm --platform $platform --volume "${workspace}:/src" --workdir /src golang:${{ env.GO_VERSION }}-alpine3.23 /bin/sh -ec $buildCommand
          if ($LASTEXITCODE -ne 0) { throw 'Alpine x-ui build failed.' }
      - name: Verify binary on Alpine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = (Get-Location).Path
          docker run --rm --platform 'linux/${{ matrix.arch }}' --volume "${workspace}:/src:ro" alpine:3.23 /src/xui-alpine -v
          if ($LASTEXITCODE -ne 0) { throw 'Alpine x-ui runtime verification failed.' }
      - name: Package Alpine release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseArchive = 'x-ui-linux-${{ matrix.arch }}.tar.gz'
          $alpineArchive = 'x-ui-linux-${{ matrix.arch }}-alpine.tar.gz'
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $baseArchive
          if ($LASTEXITCODE -ne 0) { throw "Failed to download $baseArchive." }
          tar -xzf $baseArchive
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract $baseArchive." }
          Copy-Item -LiteralPath 'xui-alpine' -Destination 'x-ui/x-ui' -Force
          tar --owner=0 --group=0 --numeric-owner -czf $alpineArchive x-ui
          if ($LASTEXITCODE -ne 0) { throw "Failed to create $alpineArchive." }
          gh release upload $env:RELEASE_TAG $alpineArchive --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload $alpineArchive." }
  linuxs390xbuild:
    name: build x-ui s390x version
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not leave the workflow token in .git/config: every job here is
          # granted contents:write, and any action in the job can otherwise read
          # a credential that can overwrite published release assets. The steps
          # that need it pass GH_TOKEN explicitly.
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build linux s390x version
        run: |
          sudo apt-get update
          sudo apt install gcc-s390x-linux-gnu -y
          CGO_ENABLED=1 GOOS=linux GOARCH=s390x CC=s390x-linux-gnu-gcc go build -pgo=default.pgo -o xui-release -v .
          mkdir x-ui
          cp xui-release x-ui/xui-release
          cp x-ui.service x-ui/x-ui.service
          cp x-ui.sh x-ui/x-ui.sh
          # Ship the OpenRC script too. It was never packaged, so every Alpine
          # install fell through to downloading its root init script from the
          # mutable main branch.
          cp x-ui.rc x-ui/x-ui.rc
          cd x-ui
          mv xui-release x-ui
          mkdir bin
          cd bin
          xray_archive=Xray-linux-s390x.zip
          xray_base="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}"
          wget -q "${xray_base}/${xray_archive}"
          wget -q "${xray_base}/${xray_archive}.dgst"
          expected="$(grep -iE '^(SHA2-256|SHA256)=' "${xray_archive}.dgst" | head -n1 | cut -d= -f2 | tr -d '[:space:]')"
          test -n "${expected}" || { echo "no SHA-256 digest published for ${xray_archive}" >&2; exit 1; }
          echo "${expected}  ${xray_archive}" | sha256sum -c -
          unzip "${xray_archive}"
          rm -f "${xray_archive}" "${xray_archive}.dgst" geoip.dat geosite.dat
          for geo_file in geoip.dat geosite.dat; do
            geo_base="https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/${GEO_RULES_VERSION}"
            wget -q "${geo_base}/${geo_file}"
            wget -q "${geo_base}/${geo_file}.sha256sum"
            sha256sum -c "${geo_file}.sha256sum"
            rm -f "${geo_file}.sha256sum"
          done
          mv xray xray-linux-s390x
          cd ..
          cd ..
      - name: package
        run: tar --owner=0 --group=0 --numeric-owner -zcvf x-ui-linux-s390x.tar.gz x-ui
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" x-ui-linux-s390x.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
